<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BACKROOMS ― 終わらない部屋</title>
<style>
:root{color-scheme:dark;--bg:#01070b;--fg:#d6f1f2;--mut:#7fa3aa;--acc:#1fd1c0;--pnl:#06161d;--bd:#12404a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:flex;justify-content:center}
#stage{position:relative;width:100%;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 22%,#050401 100%)}
#red{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(160,0,0,.8));opacity:0}
#hud{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:6px;font-size:12px;line-height:1.5;white-space:pre;color:var(--fg);text-shadow:0 0 4px #000}
#msg{white-space:pre-line;position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:16px;opacity:0;transition:opacity .4s;text-shadow:0 0 6px #000;pointer-events:none}
#pad{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;padding:0 calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));pointer-events:none}
#pad div{display:flex;gap:8px;pointer-events:auto}
#pad button{width:52px;height:52px;border-radius:50%;border:1px solid var(--bd);background:rgba(20,11,12,.55);color:var(--fg);font-size:20px;touch-action:none}
.panel{position:absolute;inset:0;background:rgba(5,3,4,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;overflow:auto}
.hidden{display:none!important}
h1{margin:0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;letter-spacing:.15em;color:var(--acc);font-size:clamp(22px,5vw,38px)}
p{margin:0;color:var(--mut);font-size:13px;line-height:1.6;max-width:520px}
input,.btn{font:inherit;border:1px solid var(--bd);background:var(--pnl);color:var(--fg);border-radius:8px;padding:9px 12px}
input{text-align:center;width:170px}input[type=checkbox]{width:auto;accent-color:var(--acc)}
.btn{cursor:pointer}.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
#pad{display:none!important}
#jb,#jk{position:absolute;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#jb{width:110px;height:110px;border:2px solid rgba(214,241,242,.35);background:rgba(214,241,242,.08)}
#jk{width:48px;height:48px;background:rgba(214,241,242,.35);border:1px solid rgba(214,241,242,.6)}
#rot{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:18px;text-align:center}
#rot i{font-size:56px;font-style:normal;display:inline-block;animation:rt 2s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="rot"><i>📱</i><div>スマホを横向きにしてね</div></div>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c" width="320" height="200"></canvas>
  <div id="fx"></div><div id="red"></div>
  <div id="hud"></div><div id="msg"></div>
  <div id="rv" style="display:none;position:absolute;left:50%;bottom:30%;transform:translateX(-50%);width:200px;text-align:center;font-size:13px;text-shadow:0 0 4px #000;pointer-events:none"><div id="rvt"></div><div style="height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden"><div id="rvb" style="height:100%;width:0;background:#ff5a5a"></div></div></div>
  <div id="jb"></div><div id="jk"></div>
  <div id="pad">
    <div><button id="bl">⟲</button><button id="br">⟳</button></div>
    <div><button id="bb">↓</button><button id="bf">↑</button></div>
  </div>
  <div id="menu" class="panel">
    <h1>BACKROOMS</h1>
    <p>鍵を2つ集めると、足元が沼のように沈みはじめ、全員で次の階層へ引きずり込まれる。階層ごとに景色が変わり、住人は壁にも仲間にも化けて追ってくる。捕まっても、仲間が2〜3秒そばにいれば復活できる。</p>
    <div class="row"><button class="btn" data-m="E">イージー</button><button class="btn main" data-m="N">ノーマル</button><button class="btn" data-m="H">ハード</button></div>
    <p id="rec"></p>
    <div class="row"><input id="nm" maxlength="12" placeholder="なまえ"></div>
    <label class="row" style="font-size:13px;color:var(--mut)"><input type="checkbox" id="ai">Claude AIを敵の頭脳にする(任意・学習メモ付き)</label>
    <div class="row"><button class="btn main" id="mk">部屋を作る</button></div>
    <div class="row"><input id="cd" maxlength="6" placeholder="部屋コード"><button class="btn" id="jn">入る</button></div>
    <div class="row"><button class="btn" id="so">ひとりで遊ぶ</button></div>
    <p id="st"></p>
    <p>PC: W/↑ 前進・S/↓ 後退・A/D または←/→ 回転・Q/E 横移動・マウスドラッグで視点　スマホ: 左側ドラッグで移動(ジョイスティック)・右側ドラッグで視点</p>
  </div>
  <div id="intro" class="panel hidden" style="background:#000;cursor:pointer"><p id="itx" style="font-size:18px;max-width:560px;min-height:4em;color:var(--fg);line-height:1.9"></p><p>タップ / クリックで次へ</p></div>
  <div id="ov" class="panel hidden">
    <h1 id="ot"></h1><p id="od"></p>
    <div class="row"><button class="btn main" id="rs">もう一度</button><button class="btn" id="sp">観戦する</button><button class="btn" id="mn">メニューへ</button></div>
  </div>
</div>
<script>
let W=320,KEYS=2;const H=200,N=11,S=2*N+1;
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
let map,kp,exitP,path,r=null,code='',running=false,ovState=null,spectate=false;
let me={x:1.5,y:1.5,a:Math.PI/4,d:false,k:[],e:false,n:'',h:0,lv:0},invuln=0,reviveT=0,lastSend=0,lastSig='';
let others=[],view={},got=new Set(),dm=99,hbT=0,last=0,hudT=0,tt;
let px=0,py=0,dx=1,dy=0,zb=new Float32Array(W);

function hash(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function bfs(sx,sy){const d=Array.from({length:S},()=>Array(S).fill(-1)),p={};d[sy][sx]=0;const q=[[sx,sy]];
  for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,b]of D4){const nx=x+a,ny=y+b;if(ny>=0&&nx>=0&&ny<S&&nx<S&&map[ny][nx]===0&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;p[nx+','+ny]=[x,y];q.push([nx,ny])}}}return{d,p}}
function route(a,b){const{p}=bfs(a[0],a[1]),o=[];let c=b;while(c&&(c[0]!==a[0]||c[1]!==a[1])){o.push(c);c=p[c[0]+','+c[1]]}return o.reverse()}

function build(seed){
  const R=rng(hash(seed));
  map=Array.from({length:S},()=>Array(S).fill(1));
  const st=[[0,0]],seen=new Set(['0,0']);map[1][1]=0;
  while(st.length){const[cx,cy]=st[st.length-1];
    const nb=D4.map(([a,b])=>[cx+a,cy+b,a,b]).filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N&&!seen.has(x+','+y));
    if(!nb.length){st.pop();continue}
    const[nx,ny,a,b]=nb[Math.floor(R()*nb.length)];
    seen.add(nx+','+ny);map[2*ny+1][2*nx+1]=0;map[2*cy+1+b][2*cx+1+a]=0;st.push([nx,ny])}
  for(let i=0;i<18;i++){const x=1+Math.floor(R()*(S-2)),y=1+Math.floor(R()*(S-2));if((x+y)%2===1)map[y][x]=0}
  const cells=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++)cells.push([2*i+1,2*j+1]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  const{d}=bfs(1,1);kp=[];
  for(const c of cells){if(kp.length>=KEYS)break;if(d[c[1]][c[0]]>10&&Math.abs(c[0]-(S-2))+Math.abs(c[1]-(S-2))>4&&kp.every(k=>Math.abs(k[0]-c[0])+Math.abs(k[1]-c[1])>8))kp.push([c[0]+.5,c[1]+.5])}
  exitP=[-50,-50];
  const wp=cells.slice(0,14);path=[];
  for(let i=0;i<wp.length;i++)path.push(...route(wp[i],wp[(i+1)%wp.length]));
  if(!path.length)path=[[S-2,S-2]];
}
function monsterPos(t){const L=path.length,s=(t/1000*2.1)%L,i=Math.floor(s),f=s-i,a=path[i],b=path[(i+1)%L];return[a[0]+.5+(b[0]-a[0])*f,a[1]+.5+(b[1]-a[1])*f]}
const wall=(x,y)=>map[Math.floor(y)][Math.floor(x)]===1;

/* sprites */
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c}
const sprMon=mk(32,64,g=>{g.fillStyle='#010304';g.beginPath();g.ellipse(16,40,12,20,0,0,7);g.fill();g.fillRect(3,34,5,26);g.fillRect(24,34,5,26);g.fillStyle='#e6f4ef';for(let i=0;i<7;i++)g.fillRect(9+i*2,36,1,5);g.fillRect(9,34,14,1);g.fillStyle='#ffe066';g.fillRect(16,1,1,13);g.fillRect(16,1,5,1);const gl=g.createRadialGradient(20,3,0,20,3,8);gl.addColorStop(0,'#fff');gl.addColorStop(.3,'#7ff');gl.addColorStop(1,'transparent');g.fillStyle=gl;g.fillRect(8,0,24,14);g.fillStyle='#8ff';g.fillRect(11,26,3,3);g.fillRect(18,26,3,3)});
const sprKey=mk(16,16,g=>{g.fillStyle='#ffd34d';g.beginPath();g.arc(8,4,3.5,0,7);g.fill();g.fillRect(7,6,2,9);g.fillRect(9,11,3,2);g.fillRect(9,14,2,2)});
const sprEx=c=>mk(24,64,g=>{const gr=g.createLinearGradient(0,0,24,0);gr.addColorStop(0,'transparent');gr.addColorStop(.5,c);gr.addColorStop(1,'transparent');g.fillStyle=gr;g.fillRect(0,0,24,64)});
const exG=sprEx('#46ff8a'),exR=sprEx('#7a1010');
const sprBody=mk(44,14,g=>{g.fillStyle='#555';g.fillRect(0,3,30,8);g.fillStyle='#b89a80';g.beginPath();g.arc(36,7,6,0,7);g.fill()});
const pc={};const sprP=h=>pc[h]||(pc[h]=mk(20,44,g=>{g.fillStyle='hsl('+h+',70%,45%)';g.fillRect(4,12,12,20);g.fillRect(4,32,5,12);g.fillRect(11,32,5,12);g.fillStyle='#e8c9a8';g.beginPath();g.arc(10,7,6,0,7);g.fill();g.fillStyle='#222';g.fillRect(6,3,9,3);g.fillStyle='#ffe9a0';g.fillRect(16,18,4,3)}));

/* audio */
let AC;
function aud(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=60;g.gain.value=.018;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;o.connect(lp).connect(g).connect(AC.destination);o.start()}catch(e){AC=null}}
function tone(f0,f1,v,d,type){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function scream(){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=.5;s.connect(g).connect(AC.destination);s.start();tone(900,200,.3,.5,'sawtooth')}

/* ui helpers */
function toast(t,ms){if(String(t).startsWith('ハンターが学習した'))return;const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>m.style.opacity=0,ms||2600)}
function showOv(t,d,win){ovState=win?'win':'lose';$('ot').textContent=t;$('od').textContent=d;$('sp').classList.toggle('hidden',!win);$('ov').classList.remove('hidden')}
function resetMe(){me.x=1.5;me.y=1.5;me.a=Math.PI/4;me.d=false;me.k=[];me.e=false;invuln=6;reviveT=0;ovState=null;spectate=false;$('ov').classList.add('hidden')}

/* game start */
async function start(c,online){
  aud();fearAudio();ambAudio();bgmInit();code=c;MODE=(online&&c.length===5&&'ENH'.includes(c[4]))?c[4]:selMode;KEYS=MODES[MODE].keys;RECS=loadRec();if(!RECS[MODE]){RECS[MODE]=1;saveRec()}build(c);
  Object.assign(hunter,{x:11.5,y:11.5,lv:0,note:''});heat=null;plan=null;memo=[];goal=null;hr=[];smp=null;aiOn=$('ai').checked;
  if(aiOn&&window.claude)claude.use('sample').then(s=>{smp=s;if(s)s.json('{"ok":1} をそのままJSONで返して',{modelTier:'quick'}).catch(()=>{})}).catch(()=>{});
  try{if(matchMedia('(pointer:coarse)').matches){const el=document.documentElement;(el.requestFullscreen?el.requestFullscreen():Promise.resolve()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}}catch(e){}
  me.n=($('nm').value.trim()||'ゲスト'+(hash(String(Math.random()))%100)).slice(0,12);
  me.h=hash(me.n+Math.random())%360;me.lv=0;sink=-1;mutT=6;inf=null;infNext=50;lvT=Date.now();me.w=null;applyTheme(0);resetMe();r=null;view={};
  if(online){
    $('st').textContent='接続中…';
    try{
      const room=window.claude&&await claude.use('room');
      if(room){r=await room.join('hr-'+c.toLowerCase());
        r.onPeers(ch=>{ch.joined.forEach(p=>{if(!p.isMe)toast(String(p.presence&&p.presence.n||'誰か').slice(0,12)+'が入室した')});ch.left.forEach(p=>{if(!p.isMe)toast(String(p.presence&&p.presence.n||'誰か').slice(0,12)+'が去った')})})}
      else toast('オンライン接続できないため、ひとりで開始します')
    }catch(e){r=null;toast('部屋に入れませんでした。ひとりで開始します')}
  }
  $('menu').classList.add('hidden');lastSig='';running=true;invuln=8;toast('鍵を2つ集めよう',4000);
}
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
$('mk').onclick=()=>{let c='';for(let i=0;i<4;i++)c+=ALPH[Math.floor(Math.random()*ALPH.length)];start(c+selMode,true)};
$('jn').onclick=()=>{const c=$('cd').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<3){$('st').textContent='部屋コードを入力してね';return}start(c,true)};
$('so').onclick=()=>start('S'+Math.floor(Math.random()*1e6),false);
$('rs').onclick=resetMe;$('sp').onclick=()=>{spectate=true;$('ov').classList.add('hidden')};

/* input */
const K={},T={};
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
[['bf','f'],['bb','b'],['bl','l'],['br','r']].forEach(([id,k])=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();T[k]=1});['pointerup','pointerleave','pointercancel'].forEach(v=>el.addEventListener(v,()=>T[k]=0))});
const J={id:null,ox:0,oy:0,x:0,y:0},LK={id:null,lx:0},stg=$('stage');
function jpos(el,x,y){el.style.left=x+'px';el.style.top=y+'px'}
cv.addEventListener('pointerdown',e=>{
  const rc=stg.getBoundingClientRect(),x=e.clientX-rc.left,y=e.clientY-rc.top;
  if(e.pointerType==='mouse'||x>rc.width*.5){if(LK.id==null){LK.id=e.pointerId;LK.lx=e.clientX}}
  else if(J.id==null){J.id=e.pointerId;J.ox=x;J.oy=y;J.x=J.y=0;jpos($('jb'),x,y);jpos($('jk'),x,y);$('jb').style.display=$('jk').style.display='block'}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===LK.id){if(running&&!me.d&&!me.e)me.a+=(e.clientX-LK.lx)*(e.pointerType==='mouse'?.008:.007);LK.lx=e.clientX}
  if(e.pointerId===J.id){const rc=stg.getBoundingClientRect();let vx=e.clientX-rc.left-J.ox,vy=e.clientY-rc.top-J.oy;const m=Math.hypot(vx,vy),R=50;if(m>R){vx*=R/m;vy*=R/m}J.x=vx/R;J.y=vy/R;jpos($('jk'),J.ox+vx,J.oy+vy)}
});
const up=e=>{if(e.pointerId===LK.id)LK.id=null;if(e.pointerId===J.id){J.id=null;J.x=J.y=0;$('jb').style.display=$('jk').style.display='none'}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
stg.addEventListener('contextmenu',e=>e.preventDefault());

/* story, textures, characters */
const INTRO=['廃業した百貨店の地下。肝試しのはずだった。','気づくと入口は消え、黄色い廊下だけが続いていた。','友達のミナが先に奥へ進んだまま、戻らない。','…無線から、ミナの声がする。「こっちにおいで」','その声に、振り向いてはいけない。'];
const DIARY=['日記 1/4「ここから出るには鍵が4つ要る。誰かが隠している。」','日記 2/4「住人は、見たものに化ける。壁にも、人にも。」','日記 3/4「ミナの声が呼んでも、振り向くな。ミナはもう——」','日記 4/4「出口が開くと、住人は最も近い人間に化けて待っている。」'];
function showIntro(cb){const el=$('intro'),tx=$('itx');let i=0,j=0,iv=null;el.classList.remove('hidden');
  const line=()=>{clearInterval(iv);j=0;tx.textContent='';iv=setInterval(()=>{tx.textContent=INTRO[i].slice(0,++j);if(j%3===0)tone(90,60,.05,.05);if(j>=INTRO[i].length)clearInterval(iv)},70)};
  el.onclick=()=>{if(j<INTRO[i].length){clearInterval(iv);j=INTRO[i].length;tx.textContent=INTRO[i];return}i++;if(i>=INTRO.length){el.classList.add('hidden');el.onclick=null;cb();return}line()};
  line()}
let blk=0,blkNext=40,gh=0,ghNext=25,whNext=15;
function whisper(){const L=['こっちにおいで…','ねえ、どこ?','うしろ…','たすけて'];if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*.9,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.sin(i/a.length*Math.PI)*(.5+.5*Math.sin(i/900));const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=1800;f.Q.value=3;g.gain.value=.25;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start()}
function step(){[0,.5,1,1.5].forEach(t=>setTimeout(()=>tone(120,50,.18,.12),t*1000))}
function events(dt){
  blkNext-=dt;if(blkNext<=0&&dif()>.1){blk=2+dif()*3+Math.random()*2;blkNext=(60+Math.random()*30)/(.6+dif()*1.4);whisper()}

function stepSnd(){if(!AC)return;const fp=TH.fp;if(fp==='tile')nz(.09,'bandpass',1800,2,.06);else if(fp==='wood')nz(.1,'bandpass',500,3,.1);else nz(.1,'lowpass',420,.6,.07)}
function ambient(){const p=(Math.random()-.5)*1.8,L=[creak,drip,slam,scrape,radioS,musicBox,()=>whisper(),()=>step()];L[Math.floor(Math.random()*L.length)](p)}
function ambAudio(){if(!AC||padO)return;try{
  padO=AC.createOscillator();padO.type='sawtooth';padO.frequency.value=38;const pf=AC.createBiquadFilter();pf.type='lowpass';pf.frequency.value=140;const pg=AC.createGain();pg.gain.value=.06;padO.connect(pf).connect(pg).connect(AC.destination);padO.start();
  const mo=AC.createOscillator();mo.type='sawtooth';mo.frequency.value=52;const mf=AC.createBiquadFilter();mf.type='lowpass';mf.frequency.value=220;monG=AC.createGain();monG.gain.value=0;monP=AC.createStereoPanner?AC.createStereoPanner():null;mo.connect(mf).connect(monG);if(monP)monG.connect(monP).connect(AC.destination);else monG.connect(AC.destination);mo.start();
  hunO=AC.createOscillator();hunO.type='sine';hunO.frequency.value=1900;hunG=AC.createGain();hunG.gain.value=0;hunP=AC.createStereoPanner?AC.createStereoPanner():null;hunO.connect(hunG);if(hunP)hunG.connect(hunP).connect(AC.destination);else hunG.connect(AC.destination);hunO.start()}catch(e){padO=null}}
function audTick(now){
  if(!AC||!padO)return;const t=AC.currentTime;bgmTick(now);
  padO.frequency.setTargetAtTime(36+(me.lv%10)*3.5,t,.5);
  const mp=monsterPos(Date.now()),md=Math.hypot(mp[0]-me.x,mp[1]-me.y),pa=Math.sin(Math.atan2(mp[1]-me.y,mp[0]-me.x)-me.a);
  monG.gain.setTargetAtTime(running?Math.pow(Math.max(0,1-md/13),2)*.2:0,t,.1);if(monP)monP.pan.setTargetAtTime(pa,t,.1);
  const hd=Math.hypot(hunter.x-me.x,hunter.y-me.y),ha=Math.sin(Math.atan2(hunter.y-me.y,hunter.x-me.x)-me.a);
  hunG.gain.setTargetAtTime(running?Math.pow(Math.max(0,1-hd/10),2)*.05*(hunter.form==='ent'?1:.35):0,t,.1);hunO.frequency.setTargetAtTime(1500+Math.max(0,1-hd/10)*900,t,.1);if(hunP)hunP.pan.setTargetAtTime(ha,t,.1);
  if(running&&now>stepAt&&md<9){stepAt=now+450;nz(.12,'lowpass',160,.7,.25*(1-md/9),pa)}
  if(running&&now>ambAt){ambAt=now+(5000+Math.random()*9000)/(1+fear*1.5+dif()*.5);ambient()}
}
/* ===== BGM (generative horror score) ===== */
let bg=null,bgPad=[],bgHiG=null,bgM=null,bgBus=null,bgNext=0,bgChord=0,bgChT=0;
const BCH=[[55,82.4,116.5],[51.9,77.8,110],[43.65,65.4,92.5],[49,73.4,103.8]];
const BSC=[220,233.1,261.6,329.6,349.2,415.3,440,466.2];
const BSH=[0,-2,1,3,-4,2,-1,4,-3,0];
function bgmInit(){if(!AC||bg)return;try{
  bgM=AC.createGain();bgM.gain.value=0;bgM.connect(AC.destination);
  bgBus=AC.createGain();bgBus.connect(bgM);
  const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();dl.delayTime.value=.45;fb.gain.value=.5;lp.type='lowpass';lp.frequency.value=1800;bgBus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(bgM);
  const pf=AC.createBiquadFilter();pf.type='lowpass';pf.frequency.value=260;const pg=AC.createGain();pg.gain.value=.05;pf.connect(pg);pg.connect(bgBus);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=120;lfo.connect(lg);lg.connect(pf.frequency);lfo.start();
  bgPad=BCH[0].map((f,i)=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=(i-1)*9;o.connect(pf);o.start();return o});
  bgHiG=AC.createGain();bgHiG.gain.value=0;bgHiG.connect(bgBus);
  [1046.5,1108.7].forEach((f,i)=>{const o=AC.createOscillator();o.type='sine';o.frequency.value=f;const tm=AC.createOscillator(),tg=AC.createGain(),am=AC.createGain();tm.frequency.value=5+i*.7;tg.gain.value=.5;am.gain.value=.5;tm.connect(tg);tg.connect(am.gain);o.connect(am);am.connect(bgHiG);o.start();tm.start()});
  bg=true}catch(e){bg=null}}
function bgNoteP(f){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+2.4);o.connect(g);g.connect(bgBus);o.start(t);o.stop(t+2.5)}
function bgmTick(now){
  if(!AC||!bg)return;const t=AC.currentTime,sh=Math.pow(2,BSH[me.lv%10]/12);
  bgM.gain.setTargetAtTime(.5*(running?1:.55)*((kl||kfade>0)?0:1),t,.4);
  bgHiG.gain.setTargetAtTime(Math.max(0,fear-.15)*.09,t,.6);
  if(now>bgChT){bgChT=now+14000+Math.random()*8000;bgChord=(bgChord+1+(Math.random()*2|0))%BCH.length;bgPad.forEach((o,i)=>o.frequency.setTargetAtTime(BCH[bgChord][i]*sh,t,3))}
  if(now>bgNext){bgNext=now+(2500+Math.random()*5500)*(1.4-fear*.8);if(fear<.75||Math.random()<.3)bgNoteP(BSC[Math.floor(Math.random()*BSC.length)]*sh*(Math.random()<.3?2:1))}
}
/* ===== scarier characters ===== */
function face(kind){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  if(kind==='grin'){
    g.fillStyle='#050403';g.fillRect(0,0,256,256);
    g.strokeStyle='rgba(70,58,46,.55)';g.lineWidth=1.5;for(let i=0;i<9;i++){g.beginPath();let x=Math.random()*256,y=Math.random()*60;g.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*30;y+=20+Math.random()*20;g.lineTo(x,y)}g.stroke()}
    g.fillStyle='rgba(0,0,0,.95)';g.beginPath();g.ellipse(80,88,36,44,-.2,0,7);g.ellipse(176,88,36,44,.2,0,7);g.fill();
    g.fillStyle='#f4f1e4';g.beginPath();g.ellipse(80,90,26,34,-.2,0,7);g.ellipse(176,90,26,34,.2,0,7);g.fill();
    g.strokeStyle='rgba(180,0,0,.55)';g.lineWidth=1;for(let i=0;i<10;i++){const a=Math.random()*6.28;[80,176].forEach(cx=>{g.beginPath();g.moveTo(cx+Math.cos(a)*24,92+Math.sin(a)*30);g.lineTo(cx+Math.cos(a)*9,96+Math.sin(a)*10);g.stroke()})}
    g.fillStyle='#000';g.beginPath();g.arc(84,96,4,0,7);g.arc(172,96,4,0,7);g.fill();
    g.fillStyle='#000';g.beginPath();g.moveTo(8,150);g.quadraticCurveTo(128,190,248,150);g.quadraticCurveTo(128,262,8,150);g.fill();
    g.fillStyle='#e9e4cf';for(let i=0;i<20;i++){const t=(i+.5)/20,x=8+240*t,yt=150+80*t*(1-t),yb=150+224*t*(1-t),k=t*(1-t)*4;g.beginPath();g.moveTo(x-5,yt);g.lineTo(x+5,yt);g.lineTo(x,yt+8+14*k);g.fill();g.beginPath();g.moveTo(x-5,yb);g.lineTo(x+5,yb);g.lineTo(x,yb-8-12*k);g.fill()}
  }else{
    g.fillStyle='#cfc6a8';g.fillRect(0,0,256,256);
    g.strokeStyle='rgba(120,30,30,.35)';g.lineWidth=1;for(let i=0;i<22;i++){g.beginPath();let x=Math.random()*256,y=Math.random()*256;g.moveTo(x,y);for(let k=0;k<4;k++){x+=(Math.random()-.5)*40;y+=(Math.random()-.5)*40;g.lineTo(x,y)}g.stroke()}
    g.fillStyle='#0a0603';g.beginPath();g.ellipse(76,92,30,42,0,0,7);g.ellipse(180,92,30,42,0,0,7);g.fill();
    [76,180].forEach(x=>{for(let i=0;i<4;i++)g.fillRect(x-14+Math.random()*28,120,2+Math.random()*3,30+Math.random()*80)});
    g.fillStyle='#fff';g.fillRect(74,98,3,3);g.fillRect(178,98,3,3);
    g.fillStyle='#050202';g.beginPath();g.ellipse(128,196,26,52,0,0,7);g.fill();
    g.fillStyle='#e9e4cf';for(let i=0;i<16;i++){const a=i/16*6.283,x=128+Math.cos(a)*24,y=196+Math.sin(a)*49;g.beginPath();g.moveTo(x-3,y-3);g.lineTo(x+3,y-3);g.lineTo(x-Math.cos(a)*8,y-Math.sin(a)*13);g.fill()}
    g.fillStyle='#3a1a12';g.fillRect(124,128,3,22);g.fillRect(132,128,3,22);
    g.strokeStyle='#3a1a12';g.lineWidth=2;for(let i=0;i<8;i++){g.beginPath();g.moveTo(30+i*6,170);g.lineTo(36+i*6,184);g.moveTo(36+i*6,170);g.lineTo(30+i*6,184);g.stroke()}
  }
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function makeEnt(kind){const g=new THREE.Group(),pale=kind==='pale',
  M=new THREE.MeshStandardMaterial({color:pale?0xcfc6a8:0x070605,roughness:.6,emissive:pale?0x2a2418:0});
  const add=(geo,x,y,z,p)=>{const o=new THREE.Mesh(geo,M);o.position.set(x,y,z);(p||g).add(o);return o};
  add(new THREE.BoxGeometry(.01,.01,.01),0,.5,0);
  const torso=new THREE.Group();torso.rotation.x=.28;torso.position.y=.5;g.add(torso);
  add(new THREE.BoxGeometry(.1,.34,.055),0,.1,0,torso);
  for(let i=0;i<5;i++)add(new THREE.BoxGeometry(.13,.008,.03),0,.22-i*.05,.02,torso);
  for(let i=0;i<4;i++)add(new THREE.SphereGeometry(.01,5,4),0,.26-i*.07,-.03,torso);
  const arm=(sx,key)=>{const p=new THREE.Group();p.position.set(sx*.075,.74,0);g.add(p);
    add(new THREE.CylinderGeometry(.011,.009,.34,6),0,-.17,0,p);
    const el=new THREE.Group();el.position.y=-.34;el.rotation.x=-.5;p.add(el);
    add(new THREE.CylinderGeometry(.009,.006,.4,6),0,-.2,0,el);
    for(let i=0;i<4;i++){const f=add(new THREE.CylinderGeometry(.003,.0015,.09,4),-.012+i*.008,-.44,.005,el);f.rotation.z=(i-1.5)*.12}
    g.userData[key]=p};
  arm(-1,'aL');arm(1,'aR');
  const leg=(sx,key)=>{const p=new THREE.Group();p.position.set(sx*.03,.4,0);g.add(p);add(new THREE.CylinderGeometry(.02,.014,.24,6),0,-.12,.03,p).rotation.x=.4;const sh=new THREE.Group();sh.position.set(0,-.23,.09);p.add(sh);add(new THREE.CylinderGeometry(.013,.008,.26,6),0,-.12,-.03,sh).rotation.x=-.5;g.userData[key]=p};
  leg(-1,'lL');leg(1,'lR');
  const head=new THREE.Group();head.position.set(0,.93,.07);head.rotation.z=.3;g.add(head);g.userData.head=head;
  const sk=add(new THREE.SphereGeometry(.055,14,12),0,0,0,head);sk.scale.set(1,1.45,1);
  const jaw=new THREE.Group();jaw.position.set(0,-.05,.01);head.add(jaw);add(new THREE.BoxGeometry(.06,.04,.05),0,-.02,.015,jaw);g.userData.jaw=jaw;
  const f=new THREE.Mesh(new THREE.PlaneGeometry(.115,.115),new THREE.MeshBasicMaterial({map:face(pale?'pale':'grin')}));f.position.set(0,.005,.054);head.add(f);
  const em=new THREE.MeshBasicMaterial({color:pale?0xaaccff:0xff2a1a,fog:false});
  [-.024,.024].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.007,8,6),em);e.position.set(x,.02,.058);head.add(e)});
  return g}
function anim(g,spd,dt){const u=g.userData;if(!u.lL)return;u.ph=(u.ph||0)+spd*dt*8;const s=Math.sin(u.ph)*Math.min(.8,spd*.5);u.lL.rotation.x=s;u.lR.rotation.x=-s;u.aL.rotation.x=-s*.6-.15;u.aR.rotation.x=s*.6-.15;
  if(u.head){const t=performance.now()/1000;u.tw=u.tw||0;if(Math.random()<dt*1.2)u.tw=(Math.random()-.5)*.5;u.tw*=1-Math.min(1,dt*6);u.head.rotation.z=.3+Math.sin(t*2.3)*.06+u.tw;u.head.rotation.y=Math.sin(t*1.7)*.2+u.tw;u.jaw.rotation.x=.25+Math.sin(t*6)*.18}}
/* ===== endless corridors ===== */
let inf=null,infNext=50;
function infStep(dt){
  if(!running||sink>=0)return;
  if(!inf){
    infNext-=dt;if(infNext>0||dif()<.05)return;
    infNext=(70+Math.random()*60)/((.8+dif())*MODES[MODE].mut);
    const ax=Math.random()<.5?'x':'y',pos=ax==='x'?me.y:me.x,i=2*Math.floor(pos/2)+1;
    if(i<1||i>S-2)return;
    const sv=[];for(let t=0;t<S;t++){const a=ax==='x'?i:t,b=ax==='x'?t:i;sv.push(map[a][b]);map[a][b]=0}
    inf={ax,i,sv,until:Date.now()+(40+Math.random()*30)*1000};rebuildWalls();rumble(0);return}
  const inLine=inf.ax==='x'?Math.floor(me.y)===inf.i:Math.floor(me.x)===inf.i;
  if(inLine){
    if(inf.ax==='x'){if(me.x<1)me.x+=20;else if(me.x>=22)me.x-=20}
    else{if(me.y<1)me.y+=20;else if(me.y>=22)me.y-=20}
  }else if(Date.now()>inf.until&&Math.abs((inf.ax==='x'?me.y:me.x)-(inf.i+.5))>2.5){
    for(let t=0;t<S;t++){const a=inf.ax==='x'?inf.i:t,b=inf.ax==='x'?t:inf.i;map[a][b]=inf.sv[t]}
    inf=null;rebuildWalls();
  }
}
showRec();
